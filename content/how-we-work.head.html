<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What does an engagement cost?","acceptedAnswer":{"@type":"Answer","text":"Fees are fixed, set by scope, and tied to milestones \u2014 the full cost is clear before the work begins. We staff every engagement with senior people, and our fees reflect that."}},{"@type":"Question","name":"Do you guarantee results?","acceptedAnswer":{"@type":"Answer","text":"We put numbers and dates on every engagement and publish a monthly scorecard against them. Regulatory outcomes belong to the agencies alone; performance accountability is ours, in writing."}},{"@type":"Question","name":"Who actually shows up?","acceptedAnswer":{"@type":"Answer","text":"Senior operators \u2014 people who have held the seat themselves, matched to your state's licensure and your community type."}},{"@type":"Question","name":"How fast do you move?","acceptedAnswer":{"@type":"Answer","text":"We are in the building within days. The first 30 days end with a plan that has numbers and dates. After that, the pace is set by the building, and the plan says what to expect."}},{"@type":"Question","name":"Can we engage for the diagnostic alone?","acceptedAnswer":{"@type":"Answer","text":"Yes \u2014 it stands on its own. Most clients continue into execution because the targets and scope are already set by the end of the week."}},{"@type":"Question","name":"Is resident information protected?","acceptedAnswer":{"@type":"Answer","text":"Yes. Chart review happens on-site in your systems, findings are de-identified in reports, and we execute a business associate agreement when required."}}]}</script>
